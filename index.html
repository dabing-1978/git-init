<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List | 待办事项 v2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>待办事项666</h1>
            <p class="subtitle" id="dateDisplay"></p>
        </header>

        <section class="input-section">
            <form id="todoForm" class="todo-form">
                <input
                    type="text"
                    id="todoInput"
                    class="todo-input"
                    placeholder="添加新的任务..."
                    autocomplete="off"
                    maxlength="200"
                    required
                />
                <button type="submit" class="add-btn" aria-label="添加任务">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </form>
        </section>

        <section class="filter-section">
            <div class="filters" role="tablist">
                <button class="filter-btn active" data-filter="all" role="tab">全部 <span class="count" id="countAll">0</span></button>
                <button class="filter-btn" data-filter="active" role="tab">进行中 <span class="count" id="countActive">0</span></button>
                <button class="filter-btn" data-filter="completed" role="tab">已完成 <span class="count" id="countCompleted">0</span></button>
            </div>
            <button class="clear-btn" id="clearCompleted" title="清除已完成">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"></path>
                    <path d="M10 11v6"></path>
                    <path d="M14 11v6"></path>
                </svg>
                清除已完成
            </button>
        </section>

        <main>
            <ul id="todoList" class="todo-list" aria-live="polite"></ul>
            <div id="emptyState" class="empty-state">
                <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 11l3 3L22 4"></path>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                </svg>
                <p>暂无任务，开始添加吧！</p>
            </div>
        </main>

        <footer class="app-footer">
            <div class="progress-wrapper">
                <div class="progress-info">
                    <span>完成进度</span>
                    <span id="progressText">0 / 0</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
